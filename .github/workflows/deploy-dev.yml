name: Deploy dev

# Deploys application code only. Infrastructure changes (terraform plan/apply) are run
# deliberately with review — never automatically from CI.
on:
  push:
    branches: [development]
    paths-ignore:
      - 'infra/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        run: pnpm typecheck && pnpm test
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::637423417590:role/giftnjoys-dev-github-deploy
          aws-region: ap-south-1
      - name: Deploy
        run: scripts/deploy/deploy.sh dev
